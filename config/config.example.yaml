# gentle-site-visitor Configuration
# Copy this file to config.yaml and fill in your values:
#   cp config/config.example.yaml config/config.yaml
#
# WARNING: config.yaml contains sensitive data and should NOT be committed to git

# Application settings
app:
  # Enable debug mode (more verbose logging)
  debug: false

  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: INFO

  # Log file path (optional, logs to console if not set)
  # log_file: logs/app.log

# Add your configuration sections below
# Example:
#
# database:
#   host: localhost
#   port: 5432
#   name: mydb
#   user: myuser
#   password: REPLACE_WITH_YOUR_PASSWORD
#
# api:
#   base_url: https://api.example.com
#   api_key: REPLACE_WITH_YOUR_API_KEY
#   timeout: 30

# Processing settings
processing:
  # Maximum concurrent operations
  max_workers: 4

  # Batch size for bulk operations
  batch_size: 100

  # Enable dry run mode (no actual changes)
  dry_run: false

visitor:
  headless: true
  storage_path: "data/browser/{site}"
  locale: en-US
  timezone_id: UTC
  page_timeout_seconds: 30
  pacing:
    profile: production
    rate_limit_per_hour: 90
    burst_cooldown_interval: 5
    burst_cooldown_range: [30.0, 90.0]
    content_wait_timeout_ms: 10000
    content_wait_reaction_range: [0.5, 1.5]
    content_wait_with_mouse_move: true
    post_login_warmup: true
    profiles:
      production:
        min_seconds: 2.0
        max_seconds: 5.0
        distraction_chance: 0.10
        distraction_min_seconds: 15.0
        distraction_max_seconds: 45.0
      recon:
        min_seconds: 0.8
        max_seconds: 1.8
      auth:
        min_seconds: 0.5
        max_seconds: 1.0
      disabled:
        min_seconds: 0.0
        max_seconds: 0.0
  fingerprint:
    viewport_width_range: [1260, 1380]
    viewport_height_range: [780, 900]
  observability:
    mode: failures
    trace: true
    har: true
    video: false
    sessions_dir: "data/sessions"
    har_content: omit
  worker:
    api_url: "http://127.0.0.1:8085"
    api_key: "${GSV_API_KEY:-}"
    lease_ttl_seconds: 120
    heartbeat_interval_seconds: 30

sites:
  example:
    storage_path: "data/browser/example"
    locale: en-US
    timezone_id: UTC
    page_timeout_seconds: 30
    allowed_host_globs:
      - "**/*.example.com/**"

observability:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: INFO

  # Console output style: human or json
  log_format: human

  # Optional JSONL file path for dual-sink logging
  jsonl_log_path: ""

  # Optional session-artifact pattern for long-running tasks
  sessions:
    enabled: false
    sessions_dir: "data/sessions"
    mode: "failures"
    retention_days: 14
    max_sessions: 100
