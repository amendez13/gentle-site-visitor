visitor:
  headless: true
  storage_path: "data/browser/{site}"
  pacing:
    profile: production
    profiles:
      production:
        min_seconds: "${GSV_EXAMPLE_DELAY_MIN:-0.1}"
        max_seconds: "${GSV_EXAMPLE_DELAY_MAX:-0.25}"
        distraction_chance: "${GSV_EXAMPLE_DISTRACTION_CHANCE:-0.0}"
        distraction_min_seconds: "${GSV_EXAMPLE_DISTRACTION_MIN:-15.0}"
        distraction_max_seconds: "${GSV_EXAMPLE_DISTRACTION_MAX:-45.0}"
    rate_limit_per_hour: "${GSV_EXAMPLE_RATE_LIMIT_PER_HOUR:-90}"
    burst_cooldown_interval: "${GSV_EXAMPLE_BURST_INTERVAL:-50}"
    burst_cooldown_range:
      - "${GSV_EXAMPLE_BURST_MIN:-0.5}"
      - "${GSV_EXAMPLE_BURST_MAX:-1.0}"
    content_wait_timeout_ms: 10000
    content_wait_reaction_range:
      - "${GSV_EXAMPLE_CONTENT_WAIT_MIN:-0.05}"
      - "${GSV_EXAMPLE_CONTENT_WAIT_MAX:-0.1}"
    post_login_warmup: false
  observability:
    mode: failures
    trace: "${GSV_EXAMPLE_TRACE:-true}"
    har: true
    video: false
    sessions_dir: "data/sessions"
    retention_days: 14
    max_sessions: 100
  schedule:
    activity_window_start: "09:00"
    activity_window_end: "21:00"
    rest_min_minutes: 60
    rest_max_minutes: 180
    profiles:
      - id: asteroid_morning
        name: Morning asteroid scan
        frequency: weekdays
        preferred_time: "10:00"
        jitter_minutes: 30

sites:
  example:
    app_module: apps.example
    storage_path: "data/browser/example"
    locale: en-US
    timezone_id: UTC
    page_timeout_seconds: 30
    allowed_host_globs:
      - "https://en.wikipedia.org/**"
    auth:
      auth_marker_url: "https://en.wikipedia.org/wiki/List_of_exceptional_asteroids"
      warmup_url: "https://en.wikipedia.org/wiki/List_of_exceptional_asteroids"
